# Overrides on top of Detekt's default config (buildUponDefaultConfig). Keep this short.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']   # composables are PascalCase

# The default test excludes don't know skikoTest (Compose UI tests on JVM, iOS and wasmJs), so add it.
complexity:
  TooManyFunctions:
    excludes: ['**/test/**', '**/*Test/**', '**/skikoTest/**']
style:
  MagicNumber:
    excludes: ['**/test/**', '**/*Test/**', '**/skikoTest/**']
