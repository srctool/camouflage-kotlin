org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# The wasm test executables link in parallel in one Kotlin daemon; its default heap runs out on CI.
kotlin.daemon.jvmargs=-Xmx6g
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true

# The core set (core, skins, navigation3, bom) shares one version; the release workflow overrides it
# with -Pversion from the tag (see docs: Publishing).
group=com.srctool.camouflage
version=0.1.0-SNAPSHOT
