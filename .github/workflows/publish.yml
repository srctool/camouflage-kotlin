name: Publish to Maven Central

# Push a tag vX.Y.Z on main to publish com.srctool.camouflage:* at version X.Y.Z:
#   git tag v0.1.0 && git push origin v0.1.0
# One macOS job publishes every module: the iOS artifacts need Xcode, and a single host
# avoids duplicate uploads to the Central Portal.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write # for the GitHub Release
  checks: read # to see that CI passed on the tagged commit

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    # Only the organization repository publishes; tags pushed to forks do nothing.
    if: github.repository == 'srctool/camouflage-kotlin'
    runs-on: macos-15
    # Optional hardening: create a "maven-central" environment with required reviewers.
    environment: maven-central
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main. Tag the merge commit on main."
            exit 1
          fi
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # CI runs the whole suite on every commit of main (JVM, Android, iOS), so the release does not run it a second
      # time on one macOS runner (30+ minutes, and macOS runner settings such as Reduce Motion differ from CI's).
      # It requires those two CI jobs to have passed on exactly the tagged commit instead.
      - name: Require CI to have passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | [.name, (.conclusion // "")] | @tsv')
          for name in "Check (JVM, Android, ABI, Detekt, layers)" "iOS (simulator tests, sample app)"; do
            if ! printf '%s\n' "$runs" | awk -F'\t' -v n="$name" '$1 == n && $2 == "success" { ok = 1 } END { exit !ok }'; then
              echo "::error::The CI job '$name' has not passed on $GITHUB_SHA. Wait for CI on main, then tag."
              exit 1
            fi
          done

      # The API reference (Dokka HTML, one folder per module) travels with the release, so it needs no Pages setup.
      # Built before the publish on purpose: a failure here must not leave artifacts on Maven Central with no release.
      - name: Build the API reference
        run: |
          ./gradlew dokkaGenerate -Pversion="$VERSION"
          mkdir -p api-docs
          for dir in camouflage-*/build/dokka/html; do
            module="${dir%%/*}"
            mkdir -p "api-docs/$module" && cp -R "$dir"/. "api-docs/$module/"
          done
          zip -qr "camouflage-kotlin-api-$VERSION.zip" api-docs

      - name: Publish and release on the Central Portal
        # The com.srctool.publish convention plugin uses project.version, so the tag decides the version.
        # A failed upload leaves an unreleased deployment: drop it in the portal and re-run; never bump
        # the version to "fix" a failed upload.
        run: ./gradlew publishAndReleaseToMavenCentral -Pversion="$VERSION" --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: camouflage-kotlin-api-${{ env.VERSION }}.zip
